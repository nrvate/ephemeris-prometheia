[build-system]
requires = ["setuptools>=61", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheia"
version = "0.7.3"
description = "Ephemeris Prometheia from Python: the engine in process, and the JSON tools over stdio, HTTP or the binary protocol"
requires-python = ">=3.8"
license = {text = "GPL-2.0-or-later"}
readme = "README.md"

[tool.setuptools]
packages = ["prometheia"]
